<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IE 記帳</title><style>body{font:16px system-ui;margin:auto;max-width:950px;padding:16px;background:#f4f6fa;color:#17263b}section{background:white;padding:18px;border-radius:12px;margin:14px 0}input,select,button{font:inherit;padding:10px;margin:4px;max-width:95%;border:1px solid #ccd4df;border-radius:6px}button{background:#e4edff;cursor:pointer}label{display:inline-block}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}.warn{color:#984a00}small{display:block}#list{overflow-x:auto}h2{font-size:20px}</style><h1>IE 記帳原型</h1><p class="warn">原檔交易均待核對，不計入報表或結餘。初始結餘暫為零，請按記帳起始日設定。資料只儲存於此瀏覽器，請定期匯出備份。</p><section><button onclick="backup()">匯出 JSON 備份</button><label>還原備份<input type="file" id="restore" accept=".json"></label><button onclick="exportCSV()">匯出交易 CSV</button><small id="status"></small></section><section><h2>新增／修改交易</h2><form id="form"><input id="date" type="date" required><select id="type"><option value="expense">支出</option><option value="income">收入</option><option value="transfer">轉帳／加值／信用卡還款</option><option value="refund">消費退款</option><option value="receipt">其他收款／借款／代墊款收回</option><option value="pending">待核對</option></select><br><label>轉出／付款<select id="from"></select></label><label>轉入／收款<select id="to"></select></label><br><input id="amount" type="number" min="0.01" step="0.01" placeholder="金額 HKD" required><input id="category" list="cats" placeholder="主分類"><datalist id="cats"></datalist><input id="sub" placeholder="細項分類"><input id="note" placeholder="備註"><input id="fee" type="number" min="0" step="0.01" placeholder="轉帳手續費"><br><button>儲存交易</button><button type="button" onclick="resetForm()">取消修改</button></form><small>退款按指定主分類／細項沖減支出；原型暫不自動配對原交易。代墊收回記其他收款，不當成收入。</small></section><section><h2>戶口管理</h2><form id="af"><input id="an" placeholder="戶口名稱" required><select id="ak"><option value="bank">銀行</option><option value="wallet">電子錢包</option><option value="credit">信用卡</option><option value="cash">現金</option></select><input id="ao" type="number" step="0.01" placeholder="初始結餘" required><button>新增戶口</button></form><small>信用卡初始欠款填負數；改名不影響歷史記錄。停用戶口保留歷史。</small><div id="accounts"></div></section><section><h2>支出分析</h2><label>月份<input id="month" type="month" onchange="render()"></label><small>月份留空為全部已確認交易；不包括待核對、轉帳或其他收款。</small><div id="summary"></div><div id="analysis"></div></section><section><h2>交易及歷史核對</h2><input id="query" placeholder="搜尋戶口、分類、備註" oninput="page=0;render()"><select id="filter" onchange="page=0;render()"><option value="all">全部</option><option value="pending">待核對</option><option value="confirmed">已確認</option></select><button onclick="page=Math.max(0,page-1);render()">上一頁</button><button onclick="page++;render()">下一頁</button><div id="list"></div></section><script>
const seed={"version": 1, "accounts": [{"id": "cash", "name": "現金", "kind": "cash", "opening": 0, "active": true}], "categories": ["Meals", "Transportation", "Driving", "Personal", "Home", "Parenting", "Leisure", "Gadget", "Travel", "Others"], "transactions": [], "source": "empty"};const key='ie-ledger-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||structuredClone(seed)}catch(e){db=structuredClone(seed)}let editId=null,page=0;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>(n/100).toLocaleString('zh-HK',{minimumFractionDigits:2,maximumFractionDigits:2}),name=id=>db.accounts.find(a=>a.id===id)?.name||'—';
function save(){try{localStorage.setItem(key,JSON.stringify(db))}catch(e){alert('儲存失敗，請立即匯出備份');}render()}
function delta(t,id){if(t.type==='pending')return 0;return (t.to===id?t.amount:0)-(t.from===id?t.amount:0)}
function render(){let f=$('from').value,to=$('to').value;let opts='<option value="">—</option>'+db.accounts.filter(a=>a.active||a.id===f||a.id===to).map(a=>`<option value="${esc(a.id)}">${esc(a.name)}</option>`).join('');$('from').innerHTML=opts;$('to').innerHTML=opts;$('from').value=f;$('to').value=to;$('cats').innerHTML=[...new Set([...db.categories,...db.transactions.map(t=>t.category)])].filter(Boolean).map(c=>`<option value="${esc(c)}">`).join('');$('accounts').innerHTML='<table><tr><th>戶口</th><th>目前結餘</th><th>管理</th></tr>'+db.accounts.map((a,i)=>`<tr><td>${esc(a.name)} ${a.active?'':'（停用）'}</td><td>${money(a.opening+db.transactions.reduce((n,t)=>n+delta(t,a.id),0))}</td><td><button onclick="editAccount(${i})">修改</button><button onclick="toggleAccount(${i})">${a.active?'停用':'啟用'}</button></td></tr>`).join('')+'</table>';
let ts=db.transactions.filter(t=>t.type!=='pending'&&(!$('month').value||t.date.startsWith($('month').value))),expense=0,income=0,group={};for(let t of ts){if(t.type==='income')income+=t.amount;if(['expense','refund'].includes(t.type)){let n=t.amount*(t.type==='refund'?-1:1);expense+=n;let k=(t.category||'未分類')+' → '+(t.subcategory||'未指定細項');group[k]=(group[k]||0)+n}}$('summary').textContent=`收入 $${money(income)} ｜ 淨支出 $${money(expense)} ｜ 收支差額 $${money(income-expense)}`;$('analysis').innerHTML='<table><tr><th>主分類 → 細項</th><th>淨支出</th></tr>'+Object.entries(group).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${money(v)}</td></tr>`).join('')+'</table>';
let q=$('query').value.toLowerCase(),mode=$('filter').value;let list=db.transactions.filter(t=>(mode==='all'||(mode==='pending'?t.type==='pending':t.type!=='pending'))&&(!$('month').value||t.date.startsWith($('month').value))&&[name(t.from),name(t.to),t.category,t.subcategory,t.note].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.date.localeCompare(a.date));page=Math.min(page,Math.max(0,Math.ceil(list.length/40)-1));$('status').textContent=`共 ${db.transactions.length} 筆，待核對 ${db.transactions.filter(t=>t.type==='pending').length} 筆。`;$('list').innerHTML=`<p>符合 ${list.length} 筆；第 ${page+1} 頁</p><table><tr><th>日期／性質</th><th>戶口／分類</th><th>金額</th><th>操作</th></tr>`+list.slice(page*40,page*40+40).map(t=>`<tr><td>${esc(t.date)}<small>${esc(t.type)}</small></td><td>${esc(name(t.from))} → ${esc(name(t.to))}<small>${esc(t.category)} / ${esc(t.subcategory)} / ${esc(t.note)}</small></td><td>${money(t.amount)}</td><td><button onclick="edit('${esc(t.id)}')">核對／修改</button><button onclick="remove('${esc(t.id)}')">刪除</button></td></tr>`).join('')+'</table>'}
function resetForm(){editId=null;$('form').reset();$('date').value=[new Date().getFullYear(),String(new Date().getMonth()+1).padStart(2,'0'),String(new Date().getDate()).padStart(2,'0')].join('-');$('fee').value='';}
function edit(id){let t=db.transactions.find(t=>t.id===id);editId=id;$('date').value=t.date;$('type').value=t.type;$('from').value=t.from;$('to').value=t.to;$('amount').value=t.amount/100;$('category').value=t.category;$('sub').value=t.subcategory;$('note').value=t.note;$('fee').value='';$('form').scrollIntoView({behavior:'smooth'});}
$('form').onsubmit=e=>{e.preventDefault();let type=$('type').value,from=$('from').value,to=$('to').value,a=Math.round(Number($('amount').value)*100),fee=Math.round(Number($('fee').value||0)*100);if(!Number.isSafeInteger(a)||a<=0)return alert('金額無效');if(['expense'].includes(type)){to='';if(!from)return alert('請選付款戶口')}if(['income','refund','receipt'].includes(type)){from='';if(!to)return alert('請選收款戶口')}if(type==='transfer'&&(!from||!to||from===to))return alert('請選兩個不同戶口');if(fee&&type!=='transfer')return alert('手續費欄只用於轉帳');if(fee<0||!Number.isSafeInteger(fee))return alert('手續費無效');let old=db.transactions.find(t=>t.id===editId);if(old?.original&&!confirm('確認已核對原記錄的日期、交易性質及戶口？'))return;let t={id:editId||crypto.randomUUID(),date:$('date').value,type,from,to,amount:a,category:$('category').value.trim(),subcategory:$('sub').value.trim(),note:$('note').value, ...(old?.original?{original:old.original}:{})};if(editId)db.transactions[db.transactions.findIndex(t=>t.id===editId)]=t;else db.transactions.push(t);if(fee)db.transactions.push({id:crypto.randomUUID(),date:t.date,type:'expense',from,to:'',amount:fee,category:'手續費',subcategory:'轉帳',note:'關聯 '+t.id});save();resetForm()};
$('af').onsubmit=e=>{e.preventDefault();let n=$('an').value.trim(),o=Math.round(Number($('ao').value)*100);if(!n||db.accounts.some(a=>a.name===n)||!Number.isSafeInteger(o))return alert('名稱重複或結餘無效');db.accounts.push({id:crypto.randomUUID(),name:n,kind:$('ak').value,opening:o,active:true});save();$('af').reset()};function editAccount(i){let a=db.accounts[i],n=prompt('戶口名稱',a.name);if(n===null)return;n=n.trim();if(!n||db.accounts.some((x,j)=>j!==i&&x.name===n))return alert('名稱無效或重複');let o=prompt('初始結餘（信用卡欠款填負數）',a.opening/100);if(o===null)return;if(!o.trim()||!Number.isFinite(Number(o)))return alert('結餘無效');a.name=n;a.opening=Math.round(Number(o)*100);save()}function toggleAccount(i){db.accounts[i].active=!db.accounts[i].active;save()}function remove(id){if(confirm('永久刪除此交易？如有獨立手續費，請另行核對該筆記錄。')){db.transactions=db.transactions.filter(t=>t.id!==id);save()}}
function download(text,file,type){let u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=file;a.click();setTimeout(()=>URL.revokeObjectURL(u),10000)}function backup(){download(JSON.stringify(db,null,2),'IE-backup.json','application/json')}function exportCSV(){let rows=[['id','date','type','from','to','amount_HKD','category','subcategory','note'],...db.transactions.map(t=>[t.id,t.date,t.type,name(t.from),name(t.to),t.amount/100,t.category,t.subcategory,t.note])];let cell=v=>'"'+String(v??'').replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"';download('﻿'+rows.map(r=>r.map(cell).join(',')).join('
'),'IE-transactions.csv','text/csv')}
$('restore').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(x.version!==1||!Array.isArray(x.accounts)||!Array.isArray(x.transactions)||!Array.isArray(x.categories))throw Error('格式不符');let ids=new Set(x.accounts.map(a=>a.id));if(ids.size!==x.accounts.length||x.accounts.some(a=>typeof a.name!=='string'||!Number.isSafeInteger(a.opening))||x.transactions.some(t=>!['pending','expense','income','transfer','refund','receipt'].includes(t.type)||!Number.isSafeInteger(t.amount)||t.amount<=0||typeof t.date!=='string'||(t.from&&!ids.has(t.from))||(t.to&&!ids.has(t.to))))throw Error('資料驗證失敗');if(confirm('還原會取代目前資料；請先匯出備份。繼續？')){db=x;save();resetForm()}}catch(e){alert('還原失敗：'+e.message)}};render();resetForm();
</script></html>
